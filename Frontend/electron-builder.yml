appId: com.devagentstudio.app
productName: DevAgent Studio
directories:
  buildResources: build
files:
  - 'out/**'
  - 'resources/icon.png'
  - 'package.json'
  - '!node_modules/**'
asarUnpack:
  - resources/**
win:
  target: nsis
  verifyUpdateCodeSignature: false
  executableName: devagentstudio
  extraResources:
    - from: resources/backend/win32
      to: backend
      filter:
        - .env
        - .env.st
        - .env.uat
        - .env.prd
        - '**/*'
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - dmg
    - zip
  extraResources:
    - from: resources/backend/darwin-${arch}
      to: backend
      filter:
        - .env
        - .env.st
        - .env.uat
        - .env.prd
        - '**/*'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}-setup.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# 各环境使用独立 CDN，固定清单名以匹配客户端的 latest 更新通道。
detectUpdateChannel: false
publish:
  provider: generic
  channel: latest
  url: http://127.0.0.1:18081/ # 本地测试时使用，发布时请改为实际的 CDN 地址
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
