<!doctype html>
<!--
  DesignRenderer 的 iframe 容器文档。

  为什么用独立静态 HTML 而非 srcdoc：主窗口 index.html 的 CSP 是
  script-src 'self'（无 'unsafe-inline'），srcdoc iframe 会继承父 CSP，
  导致 DesignRenderer 注入的 inline <script>（编译产物）被静默阻止。
  改用独立 HTML 文件作为 iframe src，它有自己宽松的 CSP，不继承父窗口，
  inline script 可正常执行。

  通信：主窗口 postMessage 把编译后的 JS 代码发过来，本文档在隔离的 iframe
  内执行并挂载组件，再 postMessage 通知主窗口；主窗口不读取 iframe DOM。
-->
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src data: https:; connect-src 'none';" />
<style>
  html,body{margin:0;padding:0;height:100%;}
  #root{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;}
</style>
</head>
<body>
<div id="root"></div>
<script>
  // process shim：兜底 antd5 依赖里残留的 process.versions 等读取。
  window.process = window.process || { env: { NODE_ENV: 'production' }, versions: {}, platform: 'browser' };
</script>
<script src="./antd5-runtime.js"></script>
<script>
  var nonce = new URLSearchParams(window.location.hash.slice(1)).get('nonce');
  var root = null;
  var renderSequence = 0;

  // 仅向父窗口报告真实的运行时状态，防止丢失首个 ready 消息时永久等待。
  function reportReady() {
    window.parent.postMessage(window.__DESIGN_RUNTIME__
      ? { type: 'design-frame-ready', nonce: nonce }
      : { type: 'design-frame-error', nonce: nonce, error: 'antd5 runtime bundle 未加载' }, '*');
  }

  // 监听主窗口发来的编译产物，在本文档 window 上下文执行。
  window.addEventListener('message', function (event) {
    if (event.source !== window.parent) return;
    var data = event.data || {};
    if (!nonce || data.nonce !== nonce) return;
    if (data.type === 'design-frame-ping') {
      reportReady();
      return;
    }
    if (data.type !== 'design-render') return;

    // 清空上一次状态
    window.__DESIGN_COMPONENT__ = undefined;
    window.__DESIGN_ERROR__ = undefined;
    window.__DESIGN_ERROR_STACK__ = undefined;

    try {
      if (!window.__DESIGN_RUNTIME__) throw new Error('antd5 runtime bundle 未加载');
      if (typeof data.compiled !== 'string' || data.compiled.length > 1000000) {
        throw new Error('设计稿编译产物无效或过大');
      }
      // data.compiled 是 compileTsx 产物：声明 __design_exports__ 并把
      // 默认导出挂到 window.__DESIGN_COMPONENT__。
      (new Function(data.compiled))();
      var component = window.__DESIGN_COMPONENT__;
      if (typeof component !== 'function') throw new Error('设计稿没有有效的默认导出组件');
      var runtime = window.__DESIGN_RUNTIME__;
      if (!root) root = runtime.ReactDOMClient.createRoot(document.getElementById('root'));
      var currentSequence = ++renderSequence;
      var replied = false;

      // 每次渲染只回传一个终态，过期渲染不得覆盖新页面的结果。
      function finishRender(ok, error) {
        if (replied || currentSequence !== renderSequence) return;
        replied = true;
        window.parent.postMessage({
          type: 'design-rendered',
          nonce: nonce,
          ok: ok,
          error: error ? String(error.message || error) : '',
          stack: error && error.stack ? String(error.stack).slice(0, 1000) : ''
        }, '*');
      }

      // React 18 的 root.render 为异步提交，错误边界负责捕获真正渲染阶段的异常。
      class DesignRuntimeErrorBoundary extends runtime.React.Component {
        // 初始化本次预览的错误状态。
        constructor(props) {
          super(props);
          this.state = { failed: false };
        }

        // 出错后停止继续渲染损坏的组件树。
        static getDerivedStateFromError() {
          return { failed: true };
        }

        // 把异步渲染异常回传主窗口，不能提前宣告成功后留下白屏。
        componentDidCatch(error) {
          finishRender(false, error);
        }

        // 正常时透传页面组件，失败时保留空容器给主窗口错误层覆盖。
        render() {
          return this.state.failed ? null : this.props.children;
        }
      }

      root.render(runtime.React.createElement(
        DesignRuntimeErrorBoundary,
        null,
        runtime.React.createElement(component)
      ));
      // 等待两帧确认 React 已提交且根节点确有内容，再通知主窗口渲染成功。
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          if (replied || currentSequence !== renderSequence) return;
          var container = document.getElementById('root');
          if (!container || container.childNodes.length === 0) {
            finishRender(false, new Error('设计稿渲染结果为空'));
            return;
          }
          finishRender(true, null);
        });
      });
    } catch (e) {
      window.parent.postMessage({
        type: 'design-rendered',
        nonce: nonce,
        ok: false,
        error: (e && e.message) ? e.message : String(e),
        stack: (e && e.stack) ? String(e.stack).slice(0, 1000) : ''
      }, '*');
    }
  });

  // 通知主窗口：iframe 已就绪，可以发 code 了。
  reportReady();
</script>
</body>
</html>
